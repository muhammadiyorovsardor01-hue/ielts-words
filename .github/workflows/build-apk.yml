name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-apk.yml"
      - "apk/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Android project
        run: |
          mkdir -p build/www
          cp apk/capacitor.config.json build/capacitor.config.json
          cp apk/www/index.html build/www/index.html
          cd build
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap add android
          npx cap sync android

      - name: Apply app icon
        run: |
          RES="$GITHUB_WORKSPACE/build/android/app/src/main/res"
          rm -rf "$RES/mipmap-anydpi-v26"
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp "$GITHUB_WORKSPACE/apk/icons/mipmap-$d/ic_launcher.png" "$RES/mipmap-$d/ic_launcher.png"
            cp "$GITHUB_WORKSPACE/apk/icons/mipmap-$d/ic_launcher_round.png" "$RES/mipmap-$d/ic_launcher_round.png"
          done

      - name: Build APK
        run: |
          cd build/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/android/app/build/outputs/apk/debug/app-debug.apk IELTS-Words.apk
          gh release delete apk-latest --cleanup-tag -y || true
          gh release create apk-latest IELTS-Words.apk \
            --title "IELTS Words (Android)" \
            --notes "Telefonga o'rnatish uchun IELTS-Words.apk faylini yuklab oling."
