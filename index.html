<title>IELTS Words</title>

<style>
  /* Layout: one centered column, phone-first. Four section tabs on top, then a cards/test switch. */
  :root {
    --bg: #EEF1F5;
    --surface: #FFFFFF;
    --fg: #14202B;
    --muted: #5B6B7A;
    --line: #D3DAE2;
    --accent: #2447F5;
    --accent-fg: #FFFFFF;
    --accent-soft: #E1E7FF;
    --good: #12805C;
    --good-soft: #D8F1E7;
    --warn: #B4540A;
    --warn-soft: #FBE6D2;
    --font-display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
    --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F1720; --surface: #182330; --fg: #E8EEF4; --muted: #94A5B5; --line: #2A3947;
      --accent: #7C93FF; --accent-fg: #0F1720; --accent-soft: #23305E;
      --good: #4FD1A1; --good-soft: #143A2E; --warn: #F0A25E; --warn-soft: #3D2A17;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0F1720; --surface: #182330; --fg: #E8EEF4; --muted: #94A5B5; --line: #2A3947;
    --accent: #7C93FF; --accent-fg: #0F1720; --accent-soft: #23305E;
    --good: #4FD1A1; --good-soft: #143A2E; --warn: #F0A25E; --warn-soft: #3D2A17;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: var(--font-body); font-size: 15px; line-height: 1.5;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 20px 40px;
  }
  .wrap { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  .view { display: flex; flex-direction: column; gap: 16px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible {
    outline: 3px solid var(--accent); outline-offset: 2px;
  }

  header { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
  .eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  h1 { font-family: var(--font-display); font-weight: 800; font-size: 30px; line-height: 1.05; margin: 2px 0 0; letter-spacing: -.01em; text-wrap: balance; }
  .score { text-align: right; font-family: var(--font-mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
  .score b { display: block; font-size: 22px; color: var(--good); font-weight: 500; font-variant-numeric: tabular-nums; }

  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--good); transition: width .3s; }

  .sections { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .sec {
    border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 2px;
    display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 13px; font-weight: 600; min-width: 0;
  }
  .sec small { font-family: var(--font-mono); font-size: 11px; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
  .sec[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .sec[aria-selected="true"] small { color: var(--accent-fg); opacity: .85; }

  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
  .mode { border: 0; background: transparent; padding: 9px 12px; font-size: 14px; font-weight: 600; color: var(--muted); }
  .mode[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
    padding: 6px 12px; font-size: 13px; font-weight: 500; color: var(--muted);
  }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }

  .stage { perspective: 1200px; }
  .card { position: relative; width: 100%; height: 300px; border: 0; padding: 0; background: none; display: block; text-align: left; }
  .card-inner { position: absolute; inset: 0; transition: transform .45s cubic-bezier(.3,.7,.3,1); transform-style: preserve-3d; }
  .card.flipped .card-inner { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 20px; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden;
  }
  .face.back { transform: rotateY(180deg); background: var(--accent-soft); border-color: transparent; }
  .tagrow { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .tag { font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .pill { font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 999px; }
  .pill.know { background: var(--good-soft); color: var(--good); }
  .pill.learn { background: var(--warn-soft); color: var(--warn); }
  .word {
    font-family: var(--font-display); font-weight: 800; font-size: clamp(30px, 9vw, 42px);
    line-height: 1.1; letter-spacing: -.01em; overflow-wrap: anywhere; text-wrap: balance;
  }
  .face.back .word { color: var(--accent); }
  .eg { font-size: 14px; color: var(--muted); margin: 8px 0 0; }
  .eg em { font-style: normal; color: var(--fg); }
  .hint { font-size: 12px; color: var(--muted); }

  .pos { text-align: center; font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .actions { display: grid; grid-template-columns: 44px 1fr 1fr 44px; gap: 8px; }
  .btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; min-height: 46px; font-weight: 600; padding: 0 12px; }
  .btn.know { background: var(--good); border-color: var(--good); color: var(--bg); }
  .btn.learn { background: var(--warn-soft); border-color: var(--warn-soft); color: var(--warn); }
  .btn:active { transform: translateY(1px); }
  .btn:disabled, .submit:disabled { opacity: .45; cursor: default; }

  .tools { display: flex; flex-wrap: wrap; gap: 8px; }
  .tool { border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 6px 12px; font-size: 13px; color: var(--muted); }
  .tool[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

  .empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 14px; padding: 36px 20px; text-align: center; color: var(--muted); }

  /* test */
  .qstart { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .qstart p { margin: 0; color: var(--muted); font-size: 14px; }
  .qtop { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .qcard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; min-height: 140px; display: flex; flex-direction: column; justify-content: space-between; gap: 18px; }
  .opts { display: grid; gap: 8px; }
  .opt {
    text-align: left; padding: 13px 16px; border: 1px solid var(--line); background: var(--surface); color: var(--fg);
    border-radius: 10px; font-weight: 500; min-height: 48px; width: 100%; overflow-wrap: anywhere;
  }
  .opt.right { background: var(--good-soft); border-color: var(--good); color: var(--good); }
  .opt.wrong { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
  .opt:disabled { cursor: default; }
  .opt:disabled:not(.right):not(.wrong) { opacity: .55; }
  .result { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
  .result .big { font-family: var(--font-display); font-weight: 800; font-size: 44px; line-height: 1; font-variant-numeric: tabular-nums; }
  .result p { margin: 0; color: var(--muted); font-size: 14px; }
  .wronglist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 14px; }
  .wronglist li { overflow-wrap: anywhere; }

  details { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 0 16px; }
  summary { padding: 14px 0; font-weight: 600; cursor: pointer; }
  form { display: grid; gap: 10px; padding-bottom: 16px; }
  label { display: grid; gap: 4px; font-size: 12px; font-weight: 600; color: var(--muted); }
  input, select {
    font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px 12px; width: 100%; min-width: 0;
  }
  .submit { background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 10px; min-height: 44px; font-weight: 600; width: 100%; }
  .mine { list-style: none; margin: 0; padding: 0 0 14px; display: grid; gap: 6px; }
  .mine li { display: flex; justify-content: space-between; gap: 8px; align-items: center; font-size: 14px; min-width: 0; }
  .mine span { min-width: 0; overflow-wrap: anywhere; }
  .mine small { color: var(--muted); }
  .mine button { border: 0; background: none; color: var(--warn); font-size: 13px; }
  .note { font-size: 12px; color: var(--muted); margin: 0; }

  @media (prefers-reduced-motion: reduce) { .card-inner, .bar > i { transition: none; } }
</style>
</head>

    <div class="actions" id="actions">

  </div>

  <details id="addBox">
    <summary>Yangi so'z qo'shish</summary>
    <form id="addForm">
      <label for="fSec">Qaysi bo'limga?
        <select id="fSec">

          <option value="reading">Reading</option>
          <option value="writing">Writing</option>
          <option value="speaking">Speaking</option>
        </select>
      </label>

          <option value="xizmat">Xizmat</option>
          <option value="tuzoq">Tuzoq so'zlar</option>

      </label>

      <label for="fUz">O'zbekcha<input id="fUz" required autocomplete="off" placeholder="masalan: varaqa"></label>
      <label for="fEg">Misol (ixtiyoriy)<input id="fEg" autocomplete="off" placeholder="Take a leaflet at the entrance."></label>
      <button class="submit" type="submit">Qo'shish</button>
      <p class="note">Bu yerda qo'shgan so'zlar faqat shu qurilmada saqlanadi. Ko'p so'zni birdaniga menga yozsangiz, ilovaga men qo'shib beraman.</p>
    </form>
    <ul class="mine" id="mine"></ul>
  </details>
</div>

  var store = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function secName(id) { for (var i = 0; i < SECS.length; i++) if (SECS[i][0] === id) return SECS[i][1]; return id; }
  function toWord(a, ci) { var w = { en: a[0], uz: a[1], sec: a[2], sub: a[3] || "", eg: a[4] || "" }; if (ci !== undefined) w.ci = ci; return w; }
  function keyOf(w) { return w.en.toLowerCase(); }
  function shuffled(a) {
    var b = a.slice();
    for (var i = b.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = b[i]; b[i] = b[j]; b[j] = t; }
    return b;
  }

  // Older saved words had 4 fields [en, uz, topic, example]; move them to Listening.
  var custom = store.get("lc_custom", []).map(function (a) {
    if (a.length === 4) return [a[0], a[1], "listening", a[2] === "mening" ? "" : a[2], a[3] || ""];
    return a;
  });
  store.set("lc_custom", custom);

  var status = store.get("lc_status", {});
  var prefs = Object.assign({ sec: "listening", sub: "all", mode: "cards", shuffle: false, reverse: false }, store.get("lc_prefs", {}));
  delete prefs.cat;
  if (prefs.mode !== "test") prefs.mode = "cards";
  if (!SECS.some(function (s) { return s[0] === prefs.sec; })) prefs.sec = "listening";

  var all = [], order = [], cur = 0, flipped = false, quiz = null;

  function savePrefs() { store.set("lc_prefs", prefs); }
  function rebuildAll() {
    all = BASE.map(function (a) { return toWord(a); }).concat(custom.map(function (a, i) { return toWord(a, i); }));
  }
  function inSec(sec) { return all.filter(function (w) { return w.sec === sec; }); }
  function isKnown(w) { return status[keyOf(w)] === "know"; }
  function validSub() {
    if (prefs.sub === "all" || prefs.sub === "learn") return;
    if (!(prefs.sec === "listening" && SUBS[prefs.sub])) prefs.sub = "all";
  }

  function rebuildOrder(keepKey) {
    var list = inSec(prefs.sec).filter(function (w) {
      if (prefs.sub === "all") return true;
      if (prefs.sub === "learn") return status[keyOf(w)] === "learn";
      return w.sub === prefs.sub;
    });
    if (prefs.shuffle) list = shuffled(list);
    order = list;
    cur = 0;
    if (keepKey) for (var n = 0; n < order.length; n++) if (keyOf(order[n]) === keepKey) cur = n;
    flipped = false;
  }

  function renderSections() {
    $("sections").innerHTML = SECS.map(function (s) {
      var list = inSec(s[0]);
      var k = list.filter(isKnown).length;
      return '<button class="sec" role="tab" data-sec="' + s[0] + '" aria-selected="' + (prefs.sec === s[0]) + '">' +
        s[1] + "<small>" + k + "/" + list.length + "</small></button>";
    }).join("");
  }

      '<button class="mode" data-mode="cards" aria-pressed="' + (prefs.mode === "cards") + '">Kartalar</button>' +

  }

  function renderChips() {
    var subs = ["all"];
    if (prefs.sec === "listening") subs = subs.concat(["xarita", "xizmat", "tuzoq"]);
    subs.push("learn");
    $("chips").innerHTML = subs.map(function (c) {
      var label = c === "all" ? "Hammasi" : c === "learn" ? "Qiyinlari" : SUBS[c];
      return '<button class="chip" data-sub="' + c + '" aria-pressed="' + (prefs.sub === c) + '">' + label + "</button>";
    }).join("");
  }

  function renderStats() {
    var list = inSec(prefs.sec);
    var known = list.filter(isKnown).length;
    $("knownCount").textContent = known;
    $("totalLabel").textContent = "/ " + list.length + " bilaman";
    $("barFill").style.width = (list.length ? (known / list.length) * 100 : 0) + "%";
  }

  function renderCard() {
    var stage = $("stage");
    $("shuffle").setAttribute("aria-pressed", String(prefs.shuffle));
    $("reverse").setAttribute("aria-pressed", String(prefs.reverse));
    if (!order.length) {
      var msg;
      if (prefs.sub === "learn") msg = "Hali qiyin deb belgilangan so'z yo'q. \"Yana o'rganaman\" tugmasini bosgan yoki testda xato qilgan so'zlaringiz shu yerga tushadi.";
      else if (!inSec(prefs.sec).length) msg = "Bu bo'limda hali so'z yo'q. Pastdagi \"Yangi so'z qo'shish\" orqali o'zingiz qo'shing yoki menga so'zlarni yuboring.";
      else msg = "Bu mavzuda so'z yo'q.";
      stage.innerHTML = '<div class="empty">' + esc(msg) + "</div>";
      $("pos").textContent = ""; $("actions").hidden = true;
      return;
    }
    $("actions").hidden = false;
    var w = order[cur], st = status[keyOf(w)];
    var front = prefs.reverse ? w.uz : w.en;
    var back = prefs.reverse ? w.en : w.uz;
    var pill = st === "know" ? '<span class="pill know">bilaman</span>' : st === "learn" ? '<span class="pill learn">qiyin</span>' : "";
    stage.innerHTML =
      '<button class="card' + (flipped ? " flipped" : "") + '" id="card" aria-label="Kartani aylantirish">' +
        '<div class="card-inner">' +
          '<div class="face front"><div class="tagrow"><span class="tag">' + (prefs.reverse ? "O'zbekcha" : "English") + "</span>" + pill + "</div>" +
            '<div class="word">' + esc(front) + '</div><div class="hint">Aylantirish uchun bosing</div></div>' +
          '<div class="face back"><div class="tagrow"><span class="tag">' + (prefs.reverse ? "English" : "O'zbekcha") + "</span>" + pill + "</div>" +
            '<div><div class="word">' + esc(back) + "</div>" + (w.eg ? '<p class="eg"><em>' + esc(w.eg) + "</em></p>" : "") + "</div>" +
            '<div class="hint">' + esc(SUBS[w.sub] || secName(w.sec)) + "</div></div>" +
        "</div></button>";
    $("pos").textContent = (cur + 1) + " / " + order.length;
  }

  /* ---------- test ---------- */
  function buildQ(w) {
    var rev = prefs.reverse;
    var correct = rev ? w.en : w.uz;
    var same = shuffled(all.filter(function (x) { return x !== w && x.sec === w.sec; }));
    var other = shuffled(all.filter(function (x) { return x !== w && x.sec !== w.sec; }));
    var opts = [correct], seen = {};
    seen[correct.toLowerCase()] = 1;
    same.concat(other).forEach(function (x) {
      if (opts.length >= 4) return;
      var t = rev ? x.en : x.uz;
      if (!seen[t.toLowerCase()]) { seen[t.toLowerCase()] = 1; opts.push(t); }
    });
    return { w: w, prompt: rev ? w.uz : w.en, correct: correct, opts: shuffled(opts) };
  }

  function startQuiz(scope) {
    var pool = scope === "mixed" ? all : inSec(prefs.sec);
    if (!pool.length) return;
    var picked = shuffled(pool).slice(0, Math.min(10, pool.length));
    quiz = { scope: scope, qs: picked.map(buildQ), i: 0, score: 0, wrong: [], picked: null };
    renderQuiz();
  }

  function renderQuiz() {
    var v = $("quizView");
    $("reverse").setAttribute("aria-pressed", String(prefs.reverse));
    if (!quiz) {
      var n = inSec(prefs.sec).length;
      v.innerHTML = '<div class="qstart">' +
        "<p>So'zning ma'nosini 4 ta variantdan toping. Har testda 10 tagacha savol bo'ladi. Xato qilgan so'zlaringiz avtomatik \"Qiyinlari\" ga tushadi.</p>" +
        '<button class="submit" data-start="section"' + (n ? "" : " disabled") + ">" + esc(secName(prefs.sec)) + " bo'limidan test (" + n + " so'z)</button>" +
        '<button class="btn" data-start="mixed"' + (all.length ? "" : " disabled") + ">Aralash test (hamma bo'limlar, " + all.length + " so'z)</button>" +
        "</div>";
      return;
    }
    if (quiz.i >= quiz.qs.length) {
      var total = quiz.qs.length, pct = Math.round(quiz.score / total * 100);
      var msg = pct >= 80 ? "Juda yaxshi natija." : pct >= 50 ? "Yomon emas, yana bir mashq qiling." : "Ko'proq mashq kerak, kartalarda takrorlang.";
      var wl = quiz.wrong.length
        ? '<p>Xato qilganlaringiz (Qiyinlari ga qo\'shildi):</p><ul class="wronglist">' + quiz.wrong.map(function (w) {
            return "<li><b>" + esc(w.en) + "</b> — " + esc(w.uz) + "</li>";
          }).join("") + "</ul>"
        : "<p>Hammasi to'g'ri.</p>";
      v.innerHTML = '<div class="result"><div class="big">' + quiz.score + " / " + total + "</div><p>" + msg + "</p>" + wl + "</div>" +
        '<button class="submit" data-qagain="1">Qayta test</button>' +
        '<button class="btn" data-back="1">Kartalarga qaytish</button>';
      return;

      '<div class="qcard"><div class="tag">' + (prefs.reverse ? "O'zbekcha" : "English") + " · " + esc(secName(q.w.sec)) + "</div>" +

      '<div class="opts">' + q.opts.map(function (o, i) {

      }).join("") + "</div>";

        '<button class="submit" data-next="1">' + (last ? "Natijani ko'rish" : "Keyingi") + "</button>";
    }
    v.innerHTML = h;
  }

  function answer(i) {
    if (!quiz || quiz.picked !== null) return;
    var q = quiz.qs[quiz.i];
    quiz.picked = i;
    if (q.opts[i] === q.correct) quiz.score++;
    else { quiz.wrong.push(q.w); status[keyOf(q.w)] = "learn"; store.set("lc_status", status); }
    renderQuiz();
  }

  }

  function mark(s) {
    if (!order.length) return;
    status[keyOf(order[cur])] = s; store.set("lc_status", status);

    if (!resetArmed) { resetArmed = true; b.textContent = "Aniq tozalaymi? Yana bosing"; setTimeout(function () { resetArmed = false; b.textContent = "Natijani tozalash"; }, 3000); return; }
    resetArmed = false; b.textContent = "Natijani tozalash";
    status = {}; store.set("lc_status", status); quiz = null; rebuildOrder(); renderAll();
  });

  $("fSec").addEventListener("change", syncSub);
  $("addForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var en = $("fEn").value.trim(), uz = $("fUz").value.trim();
    if (!en || !uz) return;
    var sec = $("fSec").value, sub = sec === "listening" ? $("fSub").value : "";
    custom.push([en, uz, sec, sub, $("fEg").value.trim()]);
    store.set("lc_custom", custom); rebuildAll();
    $("addForm").reset(); $("fSec").value = sec; syncSub();
    prefs.sec = sec; prefs.sub = "all"; prefs.mode = "cards"; quiz = null; savePrefs();
    rebuildOrder(en.toLowerCase()); renderAll();
  });

  document.addEventListener("keydown", function (e) {
    var tag = (e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "select" || prefs.mode !== "cards") return;
    if (e.key === "ArrowRight") go(1);
    else if (e.key === "ArrowLeft") go(-1);
    else if (e.key === " " && order.length && tag !== "button") { e.preventDefault(); flipped = !flipped; renderCard(); }
  });

  rebuildAll();
  validSub();
  $("fSec").value = prefs.sec; syncSub();
  rebuildOrder();
  renderAll();
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
  }
</script>
